name: Android APK

# Builds a real installable Android app (.apk) from the same web code.
# Runs automatically on every push to main and can be triggered by hand.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add the Android platform
        run: npx cap add android

      - name: Sync the web app into the native project
        run: npx cap sync android

      - name: Build the debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename the APK to something friendly
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/mausam-ai.apk
          ls -la dist/

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mausam-ai-android-apk
          path: dist/mausam-ai.apk
          if-no-files-found: error

      - name: Publish the APK to a release (stable download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-latest"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/mausam-ai.apk \
            --title "MAUSAM AI — Android app (debug build)" \
            --notes "Automatic build from commit \`${GITHUB_SHA:0:7}\`.

          **Install on your phone**
          1. Download \`mausam-ai.apk\` below
          2. Open it — Android will ask to allow installs from this source, tap Allow
          3. MAUSAM AI appears in your app drawer

          This is a debug-signed build for demos, not a Play Store release."
